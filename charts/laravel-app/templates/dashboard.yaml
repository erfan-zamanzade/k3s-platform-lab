{{- if .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "laravel-app.fullname" . }}-dashboard
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
    {{- with .Values.metrics.dashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
data:
  laravel-app.json: |-
    {{- .Files.Get "dashboards/laravel-app.json" | nindent 4 }}
{{- end }}
