# `helm test`: call /ready through the Service from inside the cluster.
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "laravel-app.fullname" . }}-test-ready
  labels:
    {{- include "laravel-app.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  containers:
    - name: curl
      image: {{ include "laravel-app.image" . | quote }}
      command:
        - curl
        - --fail
        - --silent
        - --show-error
        - --retry
        - "5"
        - --retry-all-errors
        - http://{{ include "laravel-app.fullname" . }}:{{ .Values.service.port }}/ready
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          memory: 64Mi
