{{- if .Values.networkPolicy.enabled }}
# Only the ingress controller, Prometheus and the chart's own test pod may
# reach the application. Kubelet probes are not affected.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "laravel-app.fullname" . }}
  labels:
    {{- include "laravel-app.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "laravel-app.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        - podSelector:
            matchLabels:
              {{- include "laravel-app.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: test
      ports:
        - port: http
          protocol: TCP
{{- end }}
