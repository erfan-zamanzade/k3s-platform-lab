# Local k3s cluster: one server and two agents in Docker. The ingress load
# balancer is published on 127.0.0.1 only. ${...} values come from scripts/lib.sh.
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ${CLUSTER_NAME}
servers: 1
agents: 2
image: ${K3S_IMAGE}
ports:
  - port: 127.0.0.1:${LAB_HTTPS_PORT}:443
    nodeFilters: [loadbalancer]
  - port: 127.0.0.1:${LAB_HTTP_PORT}:80
    nodeFilters: [loadbalancer]
options:
  k3d:
    wait: true
    timeout: 180s
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
