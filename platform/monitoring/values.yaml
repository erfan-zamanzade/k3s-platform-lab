# kube-prometheus-stack sized for a laptop-class lab. Prometheus, Grafana and
# Alertmanager are published through the Traefik ingress with lab-CA TLS.

# k3s runs the control plane in a single process and does not expose etcd,
# kube-proxy, scheduler or controller-manager metrics on their usual ports.
# Their scrapes would only produce permanent "down" alerts.
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
kubeControllerManager:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeControllerManager: false

prometheus:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: lab-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts: [prometheus.lab.test]
    tls:
      - secretName: prometheus-tls
        hosts: [prometheus.lab.test]
  prometheusSpec:
    # Pick up ServiceMonitors and rules from every namespace and release.
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 15s
    evaluationInterval: 15s
    retention: 2d
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        memory: 1536Mi

alertmanager:
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: lab-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts: [alertmanager.lab.test]
    tls:
      - secretName: alertmanager-tls
        hosts: [alertmanager.lab.test]
  # No external notifications in the lab: alerts are inspected in the
  # Alertmanager UI and API. A real setup adds a Slack/Telegram/email receiver.
  config:
    route:
      receiver: "null"
      group_by: [alertname, namespace]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 12h
    receivers:
      - name: "null"
  alertmanagerSpec:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi

grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: lab-ca
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
    hosts: [grafana.lab.test]
    tls:
      - secretName: grafana-tls
        hosts: [grafana.lab.test]
  defaultDashboardsTimezone: utc
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 48Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
